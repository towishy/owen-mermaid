name: Attest release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest
        required: true
        default: 0.1.0

permissions:
  contents: read
  attestations: write
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build release assets
        run: npm run build

      - name: Attest main.js build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Attest styles.css build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css