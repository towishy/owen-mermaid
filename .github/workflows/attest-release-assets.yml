name: Attest release assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, upload, and attest
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: |
          node -e "if (require('./manifest.json').version !== process.env.RELEASE_TAG) throw new Error('Release tag must match manifest version')"

      - name: Run tests
        run: npm test

      - name: Build release assets
        run: npm run build

      - name: Build standalone browser editor
        run: npm run build:browser

      - name: Upload the exact assets being attested
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" main.js manifest.json styles.css --clobber

      - name: Attest manifest.json build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: manifest.json

      - name: Attest main.js build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Attest styles.css build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css